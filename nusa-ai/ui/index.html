<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root{
  --spring:cubic-bezier(0.34,1.32,0.5,1);
  --ease:cubic-bezier(.2,.8,.2,1);
  --dim:rgba(255,255,255,.5);
  --faint:rgba(255,255,255,.32);
  --pill:rgba(255,255,255,.12);
  --cyan:#19b8ff;--indigo:#2d5bff;--violet:#7b4bff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden;width:100%;height:100%;
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:#fff;font-size:13px;
  -webkit-font-smoothing:antialiased;user-select:none;cursor:default}
button{font:inherit;color:inherit;border:0;background:none;cursor:default;outline:0}

/* Separate floating card below the notch. Geometry (top/size/radius/scale/opacity) is driven from JS in phases:
   hidden = small dot tucked behind the notch; open = dot drops down -> stretches into the input pill -> grows into the chat. */
#panel{position:absolute;left:50%;top:-10px;width:44px;height:44px;border-radius:22px;background:#000;opacity:0;
  transform:translateX(-50%) scale(.5);will-change:top,width,height,transform;
  box-shadow:0 8px 20px -4px rgba(0,0,0,.62),0 2px 6px -1px rgba(0,0,0,.42)}
#panel.on{box-shadow:0 14px 34px -16px rgba(0,0,0,.88),0 4px 10px -3px rgba(0,0,0,.45)}
#clip{position:absolute;inset:0;overflow:hidden;border-radius:inherit}
/* content keeps its final width and is anchored to the bottom, so the input stays at the bottom and the chat is revealed upward */
#content{position:absolute;left:50%;bottom:0;transform:translateX(-50%);opacity:0;transition:opacity .12s ease}
#panel.on #content{opacity:1;transition:opacity .3s ease .06s}

/* attachments & drag-drop */
#panel.dragging{box-shadow:0 0 0 1.5px rgba(25,184,255,.65),0 0 24px rgba(123,75,255,.35),0 14px 34px -16px rgba(0,0,0,.88)}
#dropZone{position:absolute;inset:6px;border-radius:18px;background:rgba(8,12,24,.88);backdrop-filter:blur(10px);
  border:1.5px dashed rgba(25,184,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;z-index:30;opacity:0;pointer-events:none;transform:scale(.95);
  transition:opacity .22s ease,transform .32s var(--spring)}
#panel.dragging #dropZone{opacity:1;transform:scale(1)}
#dropZone .dz-ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(25,184,255,.22),rgba(123,75,255,.22));color:#7cc9ff;
  animation:dzFloat 1.4s ease-in-out infinite alternate}
#dropZone .dz-ico svg{width:18px;height:18px}
#dropZone .dz-t{font-size:12.5px;font-weight:600;color:#fff}
#dropZone .dz-s{font-size:11px;color:var(--dim)}
@keyframes dzFloat{from{transform:translateY(2px)}to{transform:translateY(-3px) scale(1.06)}}
#atts{display:none;flex-wrap:wrap;gap:6px;padding:6px 12px 0}
#atts.has{display:flex}
.att{position:relative;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.09);
  border-radius:10px;padding:3px;max-width:160px;font-size:11px;color:rgba(255,255,255,.85);
  animation:rise .32s var(--spring) both}
.att img{width:38px;height:38px;object-fit:cover;border-radius:7px;display:block}
.att .fn{padding:2px 6px 2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att .rm{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:#222;
  color:#fff;border:1px solid rgba(255,255,255,.25);font-size:10px;line-height:14px;text-align:center;cursor:pointer}
.att .rm:hover{background:#ff5a5a}
.u-imgs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.u-imgs img{max-width:180px;max-height:130px;min-width:64px;min-height:48px;border-radius:10px;object-fit:cover;display:block;background:rgba(255,255,255,.05);cursor: zoom-in}
.u-imgs img.ph{width:160px;height:116px}
#imgPrev{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.82);cursor:zoom-out}
#imgPrev.on{display:flex}
#imgPrev img{max-width:92%;max-height:88%;border-radius:12px;object-fit:contain;box-shadow:0 12px 36px rgba(0,0,0,.6)}
.u-docs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.u-doc{font-size:11px;background:rgba(255,255,255,.12);padding:2px 8px;border-radius:8px;color:rgba(255,255,255,.88)}

/* input pill */
#bar{display:flex;align-items:flex-end;gap:2px;margin:6px;padding:4px;
  background:rgba(255,255,255,.08);border-radius:19px;transition:background .2s}
#bar:focus-within{background:rgba(255,255,255,.115)}
#inp{flex:1;min-width:0;resize:none;border:0;outline:0;background:transparent;color:#fff;font:inherit;
  font-size:13.5px;line-height:20px;padding:4px 6px;height:28px;max-height:108px;user-select:text;cursor:text}
#inp::placeholder{color:rgba(255,255,255,.36)}
#inp::-webkit-scrollbar{width:0}
.ib{width:28px;height:28px;flex:none;border-radius:50%;color:rgba(255,255,255,.55);display:grid;place-items:center;
  transition:background .15s,color .15s,transform .25s var(--spring),opacity .2s,width .3s var(--spring)}
.ib:hover{background:rgba(255,255,255,.1);color:#fff}
.ib:active{transform:scale(.88)}
.ib svg{width:15px;height:15px}
#newb.gone{width:0;opacity:0;pointer-events:none}
#send{background:#fff;color:#000}
#send:hover{background:#fff;color:#000}
#send:disabled{background:rgba(255,255,255,.13);color:rgba(255,255,255,.38)}
#send.stop{background:rgba(255,255,255,.16);color:#fff}
#send .i-stop{display:none}
#send.stop .i-stop{display:block}
#send.stop .i-up{display:none}

/* todos */
#todo{padding:6px 18px 0;display:none}
#todo.has{display:block}
#todoHead{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);height:18px}
#todoHead .bar{flex:none;width:44px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
#todoHead .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .5s var(--ease)}
#todoHead .cur{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.75)}
#todoList{display:none;padding:4px 0 2px}
#todo.open #todoList{display:block}
.td{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:17px;padding:2px 0;color:rgba(255,255,255,.8)}
.td .c{flex:none;width:12px;height:12px;margin-top:2.5px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35)}
.td.in_progress .c{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(25,184,255,.18)}
.td.completed{color:var(--faint);text-decoration:line-through}
.td.completed .c{background:rgba(255,255,255,.35);border-color:transparent}

/* chat */
#chatWrap{height:0;overflow:hidden;margin:0 4px}
#chat,#hist{height:100%;overflow-y:auto;padding:12px 12px 6px;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 12px,#000 calc(100% - 4px),transparent 100%)}
#hist{display:none}
.vh #chat{display:none}.vh #hist{display:block}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
#msgs{display:flex;flex-direction:column;gap:9px;padding-bottom:2px}
.m{animation:rise .38s var(--spring) both;max-width:100%}
@keyframes rise{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.user{align-self:flex-end;max-width:84%;background:var(--pill);padding:7px 12px;border-radius:17px 17px 5px 17px;
  white-space:pre-wrap;word-wrap:break-word;line-height:19px;user-select:text}
.ai{line-height:20px;color:rgba(255,255,255,.92);user-select:text;word-wrap:break-word;padding:0 2px}
.ai p{margin:0 0 7px}.ai p:last-child{margin-bottom:0}
.ai .h{font-weight:600;margin:8px 0 4px;color:#fff}
.ai ul,.ai ol{margin:2px 0 7px 18px}.ai li{margin:2px 0}
.ai code{font-family:"Cascadia Code",Consolas,monospace;font-size:12px;background:rgba(255,255,255,.1);padding:1px 5px;border-radius:5px}
.ai pre{background:rgba(255,255,255,.06);border-radius:12px;padding:9px 11px;margin:4px 0 8px;overflow-x:auto;white-space:pre}
.ai pre code{background:none;padding:0;font-size:11.8px;line-height:17px}
.ai a{color:#7cc9ff;text-decoration:none}.ai a:hover{text-decoration:underline}
.ai blockquote{border-left:2px solid rgba(255,255,255,.2);padding-left:9px;color:var(--dim);margin:4px 0 7px}
.ai table{border-collapse:collapse;margin:4px 0 8px;font-size:12px}
.ai td,.ai th{border:1px solid rgba(255,255,255,.12);padding:3px 7px;text-align:left}
.ai hr{border:0;border-top:1px solid rgba(255,255,255,.12);margin:8px 0}

.trace{font-size:12px;color:var(--dim);padding:0 2px}
.tr-head{display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none;color:rgba(255,255,255,.55);
  font-size:12px;font-weight:500;padding:1px 0;transition:color .15s}
.tr-head:hover{color:rgba(255,255,255,.9)}
.tr-chev,.tr-step .sc{width:12px;height:12px;flex:none;opacity:.65;transition:transform .22s var(--spring)}
.trace.open>.tr-head .tr-chev,.tr-step.open>.tr-row .sc{transform:rotate(90deg)}
.tr-body{display:none;margin:4px 0 2px 5px;padding-left:10px;border-left:1.5px solid rgba(255,255,255,.1);
  flex-direction:column;gap:4px}
.trace.open>.tr-body{display:flex}
.tr-step{min-width:0}
.tr-row{display:flex;align-items:center;gap:6px;font-size:11.8px;color:var(--dim);cursor:pointer;user-select:none;
  min-width:0;padding:1px 0;transition:color .15s}
.tr-row:hover{color:rgba(255,255,255,.88)}
.tr-row .d{flex:none;width:5.5px;height:5.5px;border-radius:50%;background:rgba(255,255,255,.35)}
.tr-row b{font-weight:600;color:rgba(255,255,255,.72);flex:none}
.tr-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-family:"Cascadia Code",Consolas,monospace;font-size:11px}
.tr-step.run .tr-row .d{background:var(--cyan);animation:pulse 1s ease-in-out infinite}
.tr-step.ok .tr-row .d{background:rgba(255,255,255,.35)}
.tr-step.err .tr-row .d{background:#ff6b6b}.tr-step.err .tr-row b{color:#ff8f8f}
.tr-step.deny .tr-row{opacity:.55}.tr-step.deny .tr-row span{text-decoration:line-through}
.tr-detail,.tr-thought-box{font-family:"Cascadia Code",Consolas,monospace;font-size:11px;line-height:15.5px;
  color:rgba(255,255,255,.65);background:rgba(255,255,255,.045);border-radius:8px;padding:6px 8px;
  white-space:pre-wrap;word-break:break-word;max-height:130px;overflow-y:auto;user-select:text}
.tr-detail{display:none;margin:3px 0 2px}
.tr-step.open>.tr-detail{display:block}
@keyframes pulse{50%{opacity:.35;transform:scale(.7)}}

.think{font-size:12px;font-weight:500;width:max-content;
  background:linear-gradient(90deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,.4) 35%,#fff 50%,rgba(255,255,255,.4) 65%,rgba(255,255,255,.4) 100%);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.6s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:0 0}}

.card{background:rgba(255,255,255,.07);border-radius:16px;padding:10px 11px 9px}
.card .tt{font-size:12.5px;font-weight:600;margin-bottom:6px;display:flex;gap:7px;align-items:center}
.card .tt .dot{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--violet))}
.card pre{font-family:"Cascadia Code",Consolas,monospace;font-size:11.2px;line-height:16px;color:rgba(255,255,255,.75);
  white-space:pre-wrap;word-break:break-all;max-height:130px;overflow:auto;background:rgba(0,0,0,.35);border-radius:9px;padding:7px 9px;user-select:text}
.card .q{font-size:13px;line-height:19px;margin-bottom:8px;user-select:text;white-space:pre-wrap}
.btns{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center}
.pb{height:27px;padding:0 13px;border-radius:14px;background:var(--pill);font-size:12px;font-weight:500;
  transition:background .15s,transform .25s var(--spring)}
.pb:hover{background:rgba(255,255,255,.2)}
.pb:active{transform:scale(.94)}
.pb.pri{background:#fff;color:#000}
.pb.pri:hover{background:#e8e8e8}
.pb.txt{background:none;color:var(--dim);padding:0 6px}
.pb.txt:hover{color:#fff}
.askrow{display:flex;gap:6px;margin-top:8px}
.askrow input{flex:1;min-width:0;height:28px;border-radius:14px;border:0;outline:0;background:rgba(0,0,0,.35);color:#fff;font:inherit;font-size:12.5px;padding:0 11px;user-select:text}
.err{background:rgba(255,90,90,.12);color:#ffb3b3;border-radius:12px;padding:7px 10px;font-size:12px;line-height:17px;user-select:text;word-wrap:break-word}
.note{font-size:11.5px;color:var(--faint);text-align:center}

/* empty state */
#empty{padding:6px 6px 4px}
#empty .hi{font-size:15px;font-weight:600;margin-bottom:3px;
  background:linear-gradient(90deg,#fff,#cfe6ff 40%,#d8cbff);-webkit-background-clip:text;background-clip:text;color:transparent}
#empty .sub{color:var(--dim);font-size:12px;margin-bottom:10px}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.sug{height:26px;padding:0 11px;border-radius:13px;background:rgba(255,255,255,.08);font-size:11.8px;color:rgba(255,255,255,.8);transition:background .15s,transform .25s var(--spring)}
.sug:hover{background:rgba(255,255,255,.16)}
.sug:active{transform:scale(.95)}

/* history */
.hh{display:flex;align-items:center;gap:6px;margin:-4px 0 8px}
.hh .t{font-size:12.5px;font-weight:600;flex:1}
.hi-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;transition:background .15s;animation:rise .35s var(--spring) both}
.hi-item:hover{background:rgba(255,255,255,.08)}
.hi-item.cur{background:rgba(255,255,255,.06)}
.hi-item .tx{flex:1;min-width:0}
.hi-item .tl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.8px}
.hi-item .tm{font-size:11px;color:var(--faint);margin-top:1px}
.hi-item .del{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--faint);opacity:0;transition:opacity .15s,background .15s}
.hi-item:hover .del{opacity:1}
.hi-item .del:hover{background:rgba(255,90,90,.18);color:#ff9a9a}
.hi-item .del svg{width:13px;height:13px}
</style>
</head>
<body>
<div id="panel">
  <div id="clip">
    <div id="dropZone">
      <div class="dz-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></div>
      <div class="dz-t">Drop file or photo here</div>
      <div class="dz-s">Images · PDF · Word · Excel · PowerPoint</div>
    </div>
    <div id="content">
    <div id="chatWrap">
      <div id="chat"><div id="msgs"></div></div>
      <div id="hist"></div>
    </div>
    <div id="todo"><div id="todoHead"><div class="bar"><i></i></div><div class="cur"></div><span class="cnt"></span></div><div id="todoList"></div></div>
    <div id="atts"></div>
    <input type="file" id="fileIn" multiple accept="image/*,.pdf,.docx,.xlsx,.pptx,.odt,.rtf,.txt,.csv,.md,.json" style="display:none">
    <div id="cfgModal" class="m card" style="display:none;position:absolute;bottom:54px;left:10px;right:10px;z-index:99;background:#181920;border:1px solid rgba(255,255,255,.15);box-shadow:0 12px 32px rgba(0,0,0,.7);border-radius:16px;padding:14px;"></div>
    <div id="bar">
      <button class="ib" id="histb" title="Conversation history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button class="ib" id="cfgb" title="Setup AI config (Notepad)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <textarea id="inp" rows="1" placeholder="Ask Nusa AI…" spellcheck="false"></textarea>
      <button class="ib" id="attb" title="Attach photo or document">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="ib" id="send" disabled title="Send">
        <svg class="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
        <svg class="i-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5"/></svg>
      </button>
    </div>
  </div></div>
</div>
<script>
const $=s=>document.querySelector(s);
const post=o=>{try{window.ipc.postMessage(JSON.stringify(o))}catch(e){}};
const panel=$('#panel'),inp=$('#inp'),msgs=$('#msgs'),chat=$('#chat'),hist=$('#hist'),wrap=$('#chatWrap');
let L={mode:'hidden',top:186,width:420};
let running=false,view='chat',curAi=null,curAiText='',thinkEl=null,todos=[],convId='',stick=true,rafR=0,rafL=0,cfgOk=true,agState={connected:false,email:'',name:'',model:'gemini-3.8-flash'};

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

/* ---------- markdown ---------- */
function inline(s){
  const ph=[];const keep=h=>{ph.push(h);return '\u0001'+(ph.length-1)+'\u0002'};
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,(_,c)=>keep('<code>'+c+'</code>'));
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,t,u)=>keep('<a href="'+u+'">'+t+'</a>'));
  s=s.replace(/https?:\/\/[^\s<>()\u0001]+[^\s<>().,;:!?'"\u0001]/g,u=>keep('<a href="'+u+'">'+u+'</a>'));
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/__([^_\n]+)__/g,'<b>$1</b>');
  s=s.replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?!\w)/g,'$1<i>$2</i>');
  s=s.replace(/~~([^~\n]+)~~/g,'<s>$1</s>');
  return s.replace(/\u0001(\d+)\u0002/g,(_,i)=>ph[+i]);
}
function md(src){
  const lines=src.replace(/\r/g,'').split('\n');let out='',para=[],list=null,i=0;
  const flushP=()=>{if(para.length){out+='<p>'+para.map(inline).join('<br>')+'</p>';para=[]}};
  const flushL=()=>{if(list){out+='<'+list.t+'>'+list.items.map(x=>'<li>'+inline(x)+'</li>').join('')+'</'+list.t+'>';list=null}};
  while(i<lines.length){
    const l=lines[i];
    let m;
    if((m=l.match(/^\s*```(\w*)/))){flushP();flushL();const buf=[];i++;
      while(i<lines.length&&!/^\s*```/.test(lines[i])){buf.push(lines[i]);i++}
      out+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>';i++;continue}
    if(/^\s*\|.*\|\s*$/.test(l)){flushP();flushL();const rows=[];
      while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){rows.push(lines[i]);i++}
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());

    curAi=null;curTrace=null;curAiRaw='';curAiText='';curReason='';
  }
}
function updSend(){const b=$('#send');b.classList.toggle('stop',running);b.disabled=!running&&!inp.value.trim()&&!curAtts.length;b.title=running?'Stop':'Send'}

function renderTodos(items){
  todos=items||[];const t=$('#todo');
  if(!todos.length||todos.every(x=>x.status==='completed')&&!running){t.classList.remove('has');}
  else t.classList.add('has');
  const done=todos.filter(x=>x.status==='completed').length;
  const cur=todos.find(x=>x.status==='in_progress')||todos.find(x=>x.status==='pending')||todos[todos.length-1];
  t.querySelector('.bar i').style.width=(todos.length?done/todos.length*100:0)+'%';
  t.querySelector('.cur').textContent=cur?((cur.start_time?cur.start_time+' · ':'')+cur.content):'';
  t.querySelector('.cnt').textContent=done+'/'+todos.length;
  $('#todoList').innerHTML=todos.map(x=>{
    const tm=x.start_time?(x.end_time?x.start_time+'–'+x.end_time:x.start_time):'';
    return '<div class="td '+esc(x.status)+'"><i class="c"></i><div>'+(tm?'<span style="color:var(--t2);font-weight:500;margin-right:6px">'+esc(tm)+'</span>':'')+esc(x.content)+'</div></div>';
  }).join('');
  layout('content');
}

function approveCard(e){
  hideThink();curAi=null;
  const c=el('div','m card');c.dataset.pid=e.id;
  c.innerHTML='<div class="tt"><i class="dot"></i>'+esc(e.title||e.verb)+'</div>'+(e.detail?'<pre>'+esc(e.detail)+'</pre>':'')+
    '<div class="btns"><button class="pb pri" data-v="allow">Allow</button><button class="pb" data-v="deny">Deny</button>'+
    (e.always?'<button class="pb txt" data-v="always">Allow all in this chat</button>':'')+'</div>';
  c.querySelectorAll('button').forEach(b=>b.onclick=()=>{post({t:'reply',id:e.id,value:b.dataset.v});c.remove();if(running)showThink();relayout()});

}
function askCard(e){
  hideThink();curAi=null;
  const c=el('div','m card');c.dataset.pid=e.id;
  c.innerHTML='<div class="q">'+esc(e.question)+'</div><div class="btns"></div><div class="askrow"><input placeholder="Type an answer…"><button class="pb pri">Send</button></div>';
  const answer=v=>{if(!v)return;post({t:'reply',id:e.id,value:v});c.remove();addUser(v);if(running)showThink()};
  (Array.isArray(e.options)?e.options:[]).forEach(o=>{const b=el('button','pb',esc(o));b.onclick=()=>answer(o);c.querySelector('.btns').append(b)});
  if(!c.querySelector('.btns').children.length)c.querySelector('.btns').remove();
  const ii=c.querySelector('input');ii.onkeydown=k=>{if(k.key==='Enter')answer(ii.value.trim())};
  c.querySelector('.askrow .pb').onclick=()=>answer(ii.value.trim());
  msgs.append(c);scrollEnd();
}

/* ---------- history ---------- */
function ago(ts){const d=Date.now()/1000-ts;if(d<60)return 'just now';if(d<3600)return Math.floor(d/60)+'m ago';if(d<86400)return Math.floor(d/3600)+'h ago';
  if(d<86400*7)return Math.floor(d/86400)+'d ago';return new Date(ts*1000).toLocaleDateString()}
function showHist(items){
  view='hist';$('#chatWrap').classList.add('vh');
  hist.innerHTML='';
  const hh=el('div','hh','<button class="ib" id="hback" title="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><div class="t">Conversation history</div><button class="pb" id="hcfg">Setup Config</button><button class="pb" id="hnew">New</button>');
  hist.append(hh);
  hh.querySelector('#hback').onclick=closeHist;
  hh.querySelector('#hcfg').onclick=()=>post({t:'config'});
  hh.querySelector('#hnew').onclick=()=>{closeHist();post({t:'new'})};
  if(!items.length)hist.append(el('div','note','No conversations yet'));
  items.forEach((it,k)=>{
    const r=el('div','hi-item'+(it.id===convId?' cur':''));r.style.animationDelay=Math.min(k*18,240)+'ms';
    r.innerHTML='<div class="tx"><div class="tl">'+esc(it.title||'Untitled')+'</div><div class="tm">'+ago(it.updated)+' · '+it.count+' message'+(it.count===1?'':'s')+'</div></div>'+
      '<button class="del" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>';
    r.onclick=ev=>{if(ev.target.closest('.del')){post({t:'delete',id:it.id});return}closeHist();post({t:'open',id:it.id})};
    hist.append(r);
  });
  layout('mode');
}
function closeHist(){view='chat';$('#chatWrap').classList.remove('vh');layout('mode');chat.scrollTop=chat.scrollHeight}

/* ---------- input ---------- */
function autosize(){inp.style.height='28px';inp.style.height=Math.min(inp.scrollHeight,108)+'px';updSend();layout('content')}
function send(){
  const t=inp.value.trim();if((!t&&!curAtts.length)||running)return;
  if(view==='hist')closeHist();
  if(!cfgOk){showSetupCard();post({t:'send',text:t,attachments:[]});return}
  const atts=curAtts.slice();
  const imgs=atts.filter(a=>a.kind==='image').map(a=>({name:a.name,src:a.thumb||a.data}));
  const docs=atts.filter(a=>a.kind!=='image');
  curAtts=[];renderAtts();
  addUser(t,imgs,docs);post({t:'send',text:t,attachments:atts});inp.value='';autosize();setRunning(true);showThink();updSend();
}
$('#cfgb').onclick=toggleCfgModal;
$('#attb').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=e=>{addFiles(e.target.files);e.target.value=''};
document.addEventListener('paste',e=>{
  const items=e.clipboardData&&e.clipboardData.items;
  if(!items)return;
  const files=[];
  for(const it of items){if(it.kind==='file'){const f=it.getAsFile();if(f)files.push(f)}}
  if(files.length){e.preventDefault();addFiles(files)}
});
let dragT=0;
function setDragging(on){
  clearTimeout(dragT);
  if(on)dragT=setTimeout(()=>setDragging(false),4000);
  if(panel.classList.contains('dragging')===!!on)return;
  panel.classList.toggle('dragging',!!on);
  layout('content');
}
window.addEventListener('dragenter',e=>{
  e.preventDefault();
  if(e.dataTransfer)e.dataTransfer.dropEffect='copy';
  setDragging(true);
});
window.addEventListener('dragover',e=>{
  e.preventDefault();
  if(e.dataTransfer)e.dataTransfer.dropEffect='copy';
  setDragging(true);
});
window.addEventListener('dragleave',e=>{
  e.preventDefault();
  if(!e.relatedTarget||!document.documentElement.contains(e.relatedTarget))setDragging(false);
});
window.addEventListener('drop',e=>{
  e.preventDefault();
  setDragging(false);
  if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){
    addFiles(e.dataTransfer.files);
    reqFocus();
  }
});
inp.addEventListener('input',autosize);
inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}
  else if(e.key==='Escape'){e.preventDefault();if(view==='hist')closeHist();else{inp.blur();post({t:'dismiss'})}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.activeElement!==inp){if(view==='hist')closeHist();else post({t:'dismiss'})}});
let focusBusy=false;
function reqFocus(){if(focusBusy)return;focusBusy=true;post({t:'focus'});setTimeout(()=>{inp.focus();focusBusy=false},40)}
inp.addEventListener('mousedown',reqFocus);
inp.addEventListener('blur',()=>{if(!focusBusy)post({t:'blur'})});
$('#bar').addEventListener('mousedown',e=>{reqFocus();if(e.target===$('#bar')){e.preventDefault();inp.focus()}});
document.addEventListener('mousedown',e=>{const i=e.target.closest('input,textarea');if(i){if(!focusBusy){focusBusy=true;post({t:'focus'});setTimeout(()=>{i.focus();focusBusy=false},40)}}});
$('#send').onclick=()=>{if(running)post({t:'stop'});else send()};
$('#histb').onclick=()=>{if(view==='hist')closeHist();else post({t:'history'})};
document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(a){e.preventDefault();post({t:'link',url:a.getAttribute('href')})}});
document.addEventListener('contextmenu',e=>{if(!e.target.closest('input,textarea'))e.preventDefault()});
document.addEventListener('pointerdown',e=>{
  if(prevBox.classList.contains('on'))return;
  if(phase!=='shown'&&phase!=='opening')return;
  if(!e.target.closest('#panel'))post({t:'dismiss'});
});

/* ---------- events from Rust ---------- */
window.__nusa=function(e){
  switch(e.t){
  case 'layout':{
    const prev=L.mode;const n={mode:e.mode,top:e.top??L.top,width:e.width??L.width};
    if(n.mode===L.mode&&n.top===L.top&&n.width===L.width)return;
    L=n;if(L.mode==='hidden'){closePrev();if(document.activeElement)document.activeElement.blur()}
    layout('mode');
    if(prev==='hidden'&&L.mode!=='hidden'&&stick)setTimeout(()=>chat.scrollTop=chat.scrollHeight,30);
    break}
  case 'conv':{
    closePrev();releaseChatImages(convId!==e.id);
    convId=e.id;convStart=e.start||0;loadingMore=false;
    msgs.innerHTML='';thinkEl=null;curAi=null;curTrace=null;curAiRaw='';curReason='';lastThinkMs=0;
    if(!e.items.length)showEmpty();
    e.items.forEach(it=>{
      if(it.k==='user'){if(curTrace)finalizeTrace(curTrace,1000);curTrace=null;msgs.append(makeUserEl(it.text,it.images,it.docs,true));}
      else if(it.k==='tool')toolChip({...it,restored:true});
      else if(it.k==='ai')addAi(it.text,it.ms,it.reasoning);
    });
    if(curTrace&&!e.running){finalizeTrace(curTrace,1000);curTrace=null;}
    msgs.querySelectorAll('.m').forEach(m=>m.style.animation='none');
    running=!!e.running;
    if(e.partial){ensureAi();curAiRaw=e.partial;const sp=splitThink(curAiRaw);curAiText=sp.text;curAi.innerHTML=md(curAiText)}
    if(running)showThink();
    renderTodos(e.todos||[]);updSend();
    if(e.ag)agState=e.ag;
    if(e.configured!==undefined)syncCfgState(e.configured);
    if(view==='hist')closeHist();
    layout('mode');chat.scrollTop=chat.scrollHeight;stick=true;
    observeChatImages(msgs);
    break}
  case 'setup':setRunning(false);hideThink();syncCfgState(false);break;
  case 'cfg':syncCfgState(e.ok);break;
  case 'ag_status':
    agState=e;
    if(e.connected)syncCfgState(true);
    renderCfgModal();
    break;
  case 'ag_logging_in':
    inp.placeholder='Membuka browser untuk login Google...';
    break;
  case 'ag_error':
    setRunning(false);
    msgs.append(el('div','m err',esc('Login Antigravity gagal: '+e.error)));
    scrollEnd();
    break;
  case 'more':{
    if(e.id!==convId){loadingMore=false;break}
    convStart=e.start||0;
    const savedTrace=curTrace,savedAi=curAi,savedReason=curReason,savedMs=lastThinkMs;
    curTrace=null;curAi=null;curReason='';lastThinkMs=0;
    const frag=document.createDocumentFragment(), anchor=msgs.firstChild;
    const tmp=document.createElement('div');
    (e.items||[]).forEach(it=>{
      if(it.k==='user'){if(curTrace)finalizeTrace(curTrace,1000);curTrace=null;tmp.append(makeUserEl(it.text,it.images,it.docs,true));}
      else if(it.k==='tool'){
        toolChip({...it,restored:true});
        if(curTrace&&curTrace.parentNode===msgs)tmp.append(curTrace);
      }else if(it.k==='ai'){
        addAi(it.text,it.ms,it.reasoning);
        while(msgs.lastChild&&msgs.lastChild!==anchor&&!tmp.contains(msgs.lastChild))tmp.append(msgs.lastChild);
      }
    });
    if(curTrace){finalizeTrace(curTrace,1000);curTrace=null;}
    curTrace=savedTrace;curAi=savedAi;curReason=savedReason;lastThinkMs=savedMs;
    tmp.querySelectorAll('.m').forEach(m=>{m.style.animation='none';frag.append(m)});
    const prevH=chat.scrollHeight;
    msgs.insertBefore(frag,anchor);
    chat.scrollTop+=chat.scrollHeight-prevH;
    observeChatImages(msgs);
    loadingMore=false;
    break}
  case 'thinking':
    if(e.on&&running)showThink();
    else if(!e.on){
      if(e.ms){lastThinkMs+=e.ms;if(curTrace)curTrace._ms=(curTrace._ms||0)+e.ms;}
      hideThink();
    }
    break;
  case 'reason':
    if(e.text){curReason+=e.text;ensureTrace(false);}
    break;
  case 'delta':{
    curAiRaw+=e.text;
    const sp=splitThink(curAiRaw);
    if(sp.thought)curReason=sp.thought;
    if(sp.thinking){showThink();break;}
    if(curTrace&&curTrace.dataset.done!=='1')finalizeTrace(curTrace);
    ensureAi();curAiText=sp.text;renderAi();
    break}
  case 'tool':curAi=null;curAiRaw='';toolChip(e);if(running&&e.state!=='run')showThink();scrollEnd();break;
  case 'approve':approveCard(e);break;
  case 'ask':askCard(e);break;
  case 'todos':renderTodos(e.items);break;
  case 'done':msgs.querySelectorAll('.card[data-pid]').forEach(c=>c.remove());setRunning(false);renderTodos(todos);
    if(e.stopped)msgs.append(el('div','m note','Stopped'));scrollEnd();break;
  case 'error':setRunning(false);msgs.append(el('div','m err',esc(e.text)));scrollEnd();break;
  case 'history':showHist(e.items||[]);break;
  case 'drag':setDragging(!!e.on);break;
  case 'dropped':
    setDragging(false);
    (e.items||[]).forEach(it=>curAtts.push(it));
    renderAtts();
    inp.focus();
    break;
  case 'focus':inp.focus();break;
  }
};
layout('mode');
post({t:'ready'});
